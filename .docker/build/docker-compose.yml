services:
    analytics:
        image: docker-registry.grupocednet.com.br/analytics-api:1.0.0-stable
        build:
            dockerfile: Dockerfile
            args:
                - GIT_VERSION=analytics_2
                - APP_NAME='Analytics Api'
            ssh:
                - default
        networks:
            - traefik_public
        volumes:
            - storage_data:/var/www/html/storage
            - cache_data:/var/www/html/bootstrap/cache
        ports:
            - "8053:80"
        environment:
            - APP_ENV=local
            - APP_NAME='Analytics Api'
            - APP_DEBUG=true
            - APP_TIMEZONE=America/Sao_Paulo
            - APP_URL=https://gc-integrations.grupocednet.com.br

            - PHP_MAX_EXECUTION_TIME=60
            - PHP_MAX_INPUT_TIME=60
            - PHP_POST_MAX_SIZE=2G
            - PHP_UPLOAD_MAX_FILESIZE=2G
            - PHP_MAX_FILE_UPLOADS=20
            - PHP_MEMORY_LIMIT=-1

            - REDIS_DB=0
            - REDIS_HOST=integrations_redis

        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
        secrets:
            - ssh_key

    analytics_redis:
        image: redis:alpine
        networks:
            - traefik_public
        command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
        ports:
            - 6350:6379
        volumes:
            - redis:/data

networks:
    traefik_public:
        external: true

volumes:
    storage_data:
        driver: local
    cache_data:
        driver: loca
    redis:

secrets:
    ssh_key:
        file: ~/.ssh/id_rsa
